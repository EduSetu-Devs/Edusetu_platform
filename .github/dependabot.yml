version: 2

updates:
  - package-ecosystem: npm
    directory: /server
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      server-production:
        dependency-type: production
      server-development:
        dependency-type: development

  - package-ecosystem: npm
    directory: /client
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      client-production:
        dependency-type: production
      client-development:
        dependency-type: development

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /server
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /client
    schedule:
      interval: weekly
