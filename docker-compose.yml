version: '3.8'

services:
  # Database Service: MySQL 8.0
  mysql:
    image: mysql:8.0
    container_name: edusetu_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password_edusetu_2026
      MYSQL_DATABASE: edusetu
      MYSQL_USER: edusetu_user
      MYSQL_PASSWORD: edusetu_password_2026
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - edusetu_network

  # Backend Service: Node.js / Express REST API & WebSockets
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: edusetu_server
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: edusetu_user
      DB_PASSWORD: edusetu_password_2026
      DB_NAME: edusetu
      JWT_SECRET: edusetu_super_secret_jwt_key_docker_2026
      CORS_ORIGIN: "*"
    ports:
      - "5000:5000"
    networks:
      - edusetu_network

  # Frontend Service: React 18 SPA served by Nginx
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: edusetu_client
    restart: always
    depends_on:
      - server
    ports:
      - "80:80"
      - "3000:80"
    networks:
      - edusetu_network

volumes:
  mysql_data:
    driver: local

networks:
  edusetu_network:
    driver: bridge
