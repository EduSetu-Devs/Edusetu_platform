# Production-oriented Compose stack.
# Copy .env.docker.example to .env.docker and fill every required value:
#   docker compose --env-file .env.docker up -d --build
#
# Compose intentionally has NO default passwords or signing secrets. Startup fails
# fast if a required value is missing.

services:
  mysql:
    image: mysql:8.0
    container_name: edusetu_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env.docker}
      MYSQL_DATABASE: ${DB_NAME:?Set DB_NAME in .env.docker}
      MYSQL_USER: ${DB_USER:?Set DB_USER in .env.docker}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.docker}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - edusetu_network
    security_opt:
      - no-new-privileges:true

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: edusetu_server
    restart: always
    init: true
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER:?Set DB_USER in .env.docker}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.docker}
      DB_NAME: ${DB_NAME:?Set DB_NAME in .env.docker}
      JWT_SECRET: ${JWT_SECRET:?Set a 32+ character JWT_SECRET in .env.docker}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      OTP_HASH_SECRET: ${OTP_HASH_SECRET:?Set a unique 32+ character OTP_HASH_SECRET in .env.docker}
      ADMIN_VERIFICATION_PASSWORD: ${ADMIN_VERIFICATION_PASSWORD:?Set a 12+ character ADMIN_VERIFICATION_PASSWORD in .env.docker}
      CLIENT_URL: ${CLIENT_URL:?Set CLIENT_URL to the public HTTPS origin}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      AUTH_COOKIE_SAMESITE: ${AUTH_COOKIE_SAMESITE:-lax}
      AUTH_COOKIE_SECURE: "true"
      AUTH_EXPOSE_TOKEN: "false"
      ALLOW_UNVERIFIED_REGISTRATION: "false"
      SEED_INDIAN_TUTORS: "false"
      AI_PROVIDER: ${AI_PROVIDER:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_API_URL: ${AI_API_URL:-}
      AI_MAX_TOKENS: ${AI_MAX_TOKENS:-800}
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-20000}
      AI_DAILY_USER_LIMIT: ${AI_DAILY_USER_LIMIT:-40}
      AI_DAILY_GLOBAL_LIMIT: ${AI_DAILY_GLOBAL_LIMIT:-2000}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - uploads_data:/app/uploads
    networks:
      - edusetu_network
    security_opt:
      - no-new-privileges:true

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: edusetu_client
    restart: always
    depends_on:
      - server
    ports:
      - "80:80"
    networks:
      - edusetu_network
    security_opt:
      - no-new-privileges:true

volumes:
  mysql_data:
    driver: local
  uploads_data:
    driver: local

networks:
  edusetu_network:
    driver: bridge
